[package]
name = "polyforge"
version = "3.0.0"
edition = "2021"
authors = ["Oryon Technologies <dev@polyforge.app>"]
license = "Apache-2.0"
description = "Rust SDK for the Polyforge trading platform REST API"
homepage = "https://polyforge.app"
repository = "https://github.com/Polyforge-labs/PolyForge-sdk-rust"
documentation = "https://docs.rs/polyforge"
keywords = ["polyforge", "trading", "api", "sdk", "async"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }
secrecy = { version = "0.10", features = ["serde"] }
url = "2"
urlencoding = "2"
sha3 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
http = "1"
bincode = { version = "2", features = ["serde"] }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
