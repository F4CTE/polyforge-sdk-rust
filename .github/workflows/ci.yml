name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_HOME: C:\cargo-cache
  RUSTUP_HOME: C:\Users\User\.rustup

jobs:
  check:
    name: Build, Lint & Test
    runs-on: [self-hosted, polyforge-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust to PATH
        shell: pwsh
        run: echo "C:\Users\User\.cargo\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
